<div class="flex justify-center">
  <section class="bg-indigo-900 px-4 py-4 rounded-lg shadow-lg w-full max-w-2xl">
    @for (image of [currentImage()]; track image.id) {
      <p class="heading text-4xl text-neutral-200">{{ image.title }}</p>
      <div class="relative flex justify-center items-center mt-8 h-60 overflow-hidden">
        <button
          (click)="prevImage()"
          class="absolute left-0 bg-indigo-950/70 text-neutral-200 text-3xl w-10 h-10 rounded-full hover:bg-indigo-950 cursor-pointer flex items-center justify-center"
        >
          <span class="-translate-y-1">‹</span>
        </button>
        <img
          [src]="image.path"
          class="w-full max-w-96 h-60 object-contain"
          [class.slide-left]="direction() == 'left'"
          [class.slide-right]="direction() == 'right'"
        />
        <button
          (click)="nextImage()"
          class="absolute right-0 bg-indigo-950/70 text-neutral-200 text-3xl w-10 h-10 rounded-full hover:bg-indigo-950 cursor-pointer flex items-center justify-center"
        >
          <span class="-translate-y-1">›</span>
        </button>
      </div>
    }
  </section>
</div>
