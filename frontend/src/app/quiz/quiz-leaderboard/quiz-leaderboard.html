<div class="text-center bg-indigo-950 min-h-screen pt-10">
  <h1 class="text-4xl mb-3 text-neutral-200">Quiz game leaderboard</h1>
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10 mb-8">
    <div class="space-x-4">
      <button
        (click)="applyDifficulty(1)"
        [class.bg-blue-600]="selectedDifficulty() == 1"
        [class.bg-gray-600]="selectedDifficulty() != 1"
        class="heading cursor-pointer px-4 py-2 rounded text-neutral-200"
      >
        Beginner
      </button>
      <button
        (click)="applyDifficulty(2)"
        [class.bg-blue-600]="selectedDifficulty() == 2"
        [class.bg-gray-600]="selectedDifficulty() != 2"
        class="heading cursor-pointer px-4 py-2 rounded text-neutral-200"
      >
        Intermediate
      </button>
      <button
        (click)="applyDifficulty(3)"
        [class.bg-blue-600]="selectedDifficulty() == 3"
        [class.bg-gray-600]="selectedDifficulty() != 3"
        class="heading cursor-pointer px-4 py-2 rounded text-neutral-200"
      >
        Advanced
      </button>
    </div>
    <div class="mt-6">
      <input
        #amountInput
        type="number"
        [value]="selectedAmount()"
        (change)="applyAmount(amountInput.value)"
        min="5"
        max="40"
        step="5"
        class="border border-2-black rounded font-sans bg-white"
      />
    </div>
    <div class="mt-6">
      <button
        (click)="setLeaderboard()"
        class="heading px-4 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
      >
        Apply
      </button>
    </div>
  </section>
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10">
    <h1 class="text-3xl mb-3 text-neutral-200">Quiz leaderboard</h1>
    <table class="w-full border-separate border-spacing-y-2">
      <thead>
        <tr class="text-2xl text-neutral-200">
          <th class="heading text-left px-4 py-2">Rank</th>
          <th class="heading text-center px-4 py-2">Player</th>
          <th class="heading text-right px-4 py-2">Time</th>
          <th class="heading text-right px-4 py-2">Score / Length</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of leaderboard(); track entry.id; let i = $index) {
          <tr class="bg-indigo-800/60 font-sans text-neutral-300">
            <td class="text-left px-4 py-2">{{ i + 1 }}</td>
            <td class="text-center px-4 py-2">
              <a class="cursor-pointer hover:text-white hover:underline">{{
                entry.user.userName
              }}</a>
            </td>
            <td class="text-right px-4 py-2">{{ entry.timeTaken }}</td>
            <td class="text-right px-4 py-2">{{ entry.score }} / {{ entry.totalQuestions }}</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
