<div class="text-center bg-indigo-950 pt-10 min-h-screen">
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10">
    <p class="question text-xl text-neutral-300 mb-8 font-semibold">
      {{ currentQuestion()!.question }}
    </p>
    <div class="space-y-4">
      @for (answer of choices(); track $index) {
        <section
          class="font-sans cursor-pointer border-2 border-indigo-500 rounded-lg p-4 hover:scale-[1.02] active:scale-[0.98] transition"
          [class]="getAnswerClass(answer)"
          (click)="selectAnswer(answer)"
        >
          {{ answer.text }}
        </section>
      }
    </div>
    <div class="mt-4">
      <button
        class="heading px-4 py-2 mt-4 bg-blue-600 text-neutral-200 font-medium rounded hover:bg-blue-700 cursor-pointer"
        [class.hidden]="!answered() || completed()"
        (click)="renderQuestion()"
      >
        Next Question
      </button>
    </div>
    <div class="text-center mt-10 pt-6 border-t border-indigo-200" [class.hidden]="!completed()">
      <p class="font-sans text-xl text-neutral-300">
        You finished the quiz. You got {{ score() }} out of {{ questions.length }} correct.
      </p>
      <section class="flex flex-col items-center">
        <div class="flex justify-center gap-2">
          <button
            (click)="restart()"
            class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
          >
            Restart
          </button>

          <a
            routerLink="/quiz/leaderboard"
            class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
          >
            Leaderboard
          </a>
        </div>
        <a
          routerLink="/games"
          class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
        >
          Back to game list
        </a>
      </section>
    </div>
  </section>
</div>
