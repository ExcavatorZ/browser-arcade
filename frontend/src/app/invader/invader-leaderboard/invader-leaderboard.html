<div class="text-center bg-indigo-950 min-h-screen pt-10">
  <h1 class="text-4xl mb-3 text-neutral-200">Server Invaders leaderboard</h1>
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10">
    <h1 class="text-3xl mb-3 text-neutral-200">Leaderboard</h1>
    <table class="w-full border-separate border-spacing-y-2">
      <thead>
        <tr class="text-2xl text-neutral-200">
          <th class="heading text-left px-4 py-2">Rank</th>
          <th class="heading text-center px-4 py-2">Player</th>
          <th class="heading text-right px-4 py-2">Score</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of leaderboard(); track entry.id; let i = $index) {
          <tr class="bg-indigo-800/60 font-sans text-neutral-300">
            <td class="text-left px-4 py-2">{{ i + 1 }}</td>
            <td class="text-center px-4 py-2">
              <a
                [routerLink]="['/profile', entry.user.userName]"
                class="cursor-pointer hover:text-white hover:underline"
                >{{ entry.user.userName }}</a
              >
            </td>
            <td class="text-right px-4 py-2">{{ entry.score }}</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
