<div class="text-center bg-indigo-950 pt-10 min-h-screen">
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10">
    <div class="inline-block border-10 border-indigo-950 rounded-lg">
      <div id="board" class="bg-indigo-200 w-150 h-150 relative">
        <div
          class="player"
          [style.top.px]="playerPositionY"
          [style.left.px]="playerPositionX()"
        ></div>
        @for (server of serverAmount(); track $index) {
          <div class="server" [style.left.px]="server"></div>
        }
        @for (enemy of enemies(); track $index) {
          <div
            class="enemy"
            [style.left.px]="enemy.x"
            [style.top.px]="enemy.y"
            [style.background-image]="enemy.bg"
          ></div>
        }
        @for (p of projectiles(); track $index) {
          <div class="projectile" [style.left.px]="p.x" [style.top.px]="p.y"></div>
        }
      </div>
    </div>
    <p
      id="instruction"
      class="font-sans text-xl text-neutral-300 mb-8 font-semibold"
      [class.hidden]="running() || finished()"
    >
      Press left, right or spacebar to start the game.
    </p>
    <div
      id="complete"
      class="text-center mt-10 pt-6 border-t border-indigo-200"
      [class.hidden]="!finished()"
    >
      <p class="font-sans text-xl text-neutral-300">
        Server compromised! You blocked {{ score() }} malware.
      </p>
      <section class="flex flex-col items-center">
        <div class="flex justify-center gap-2">
          <button
            (click)="restart()"
            class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
          >
            Restart
          </button>

          <a
            routerLink="/invader/leaderboard"
            class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
          >
            Leaderboard
          </a>
        </div>
        <a
          routerLink="/games"
          class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
        >
          Back to game list
        </a>
      </section>
    </div>
  </section>
</div>
