<div class="text-center bg-indigo-950 pt-10 min-h-screen">
  <h1 class="text-4xl mb-8 text-neutral-200">Login</h1>
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10">
    <p class="text-3xl font-sans text-neutral-300 mb-8">Log in to your account:</p>
    <form>
      <div class="flex flex-col items-center justify-center">
        <label class="text-2xl font-sans text-neutral-300">Username</label>
        <input type="text" class="heading border border-2-black p-1 bg-indigo-100 rounded" />
        <span
          class="mt-2 text-sm font-sans text-red-400 bg-red-900/30 px-2 py-1 rounded empty:hidden"
        ></span>
      </div>
      <div class="flex flex-col items-center justify-center mt-4">
        <label class="text-2xl font-sans text-neutral-300">Password</label>
        <input type="password" class="heading border border-2-black p-1 bg-indigo-100 rounded" />
        <span
          class="mt-2 text-sm font-sans text-red-400 bg-red-900/30 px-2 py-1 rounded empty:hidden"
        ></span>
      </div>
      <button
        class="heading px-4 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer mt-8"
      >
        Login
      </button>
    </form>
  </section>
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10 mt-10">
    <p class="text-3xl mb-8 font-sans text-neutral-300">Don't have an account?</p>
    <a
      routerLink="/signup"
      class="heading px-4 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
      >Sign up</a
    >
  </section>
</div>
