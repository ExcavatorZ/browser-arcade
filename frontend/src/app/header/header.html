<header>
  <nav class="border-b shadow-md bg-gray-800/95 backdrop-blur">
    <div class="max-w-7xl mx-auto">
      <section class="grid grid-cols-3 items-center py-3">
        <div>
          <a routerLink="/" class="heading text-xl font-semibold text-neutral-200"
            >🕹️BROWSER ARCADE</a
          >
        </div>
        <ul class="flex justify-center space-x-8">
          <li>
            <a routerLink="/" class="heading text-neutral-200 hover:text-white hover:underline"
              >HOME</a
            >
          </li>
          <li>
            <a routerLink="/games" class="heading text-neutral-200 hover:text-white hover:underline"
              >GAME LIST</a
            >
          </li>
        </ul>
        <div class="flex justify-end">
          @if (!loggedIn()) {
            <a
              routerLink="/login"
              class="heading text-neutral-200 p-2 border border-gray-700 rounded-md bg-gray-700"
              >LOGIN</a
            >
          } @else if (loggedIn()) {
            <button
              (click)="openModal()"
              class="heading cursor-pointer text-neutral-200 p-2 border border-gray-700 rounded-md bg-gray-700"
            >
              LOGOUT
            </button>
          }
        </div>
      </section>
    </div>
  </nav>
</header>
