<div class="text-center bg-indigo-950 pt-10 min-h-screen">
  <section class="bg-indigo-900 max-w-3xl mx-auto rounded-lg shadow-lg p-10">
    <div class="inline-block border-10 border-indigo-950 rounded-lg">
      <div id="board" class="bg-indigo-200 w-150 h-150 grid grid-cols-20 grid-rows-20">
        @for (segment of snake(); track $index) {
          <div
            [class.snake-blue]="$even"
            [class.snake-yellow]="$odd"
            [style.grid-column]="segment.x"
            [style.grid-row]="segment.y"
          ></div>
        }
        <div class="bug" [style.grid-column]="bug().x" [style.grid-row]="bug().y"></div>
      </div>
    </div>
    <p
      id="instruction"
      class="font-sans text-xl text-neutral-300 mb-8 font-semibold"
      [class.hidden]="running()"
    >
      Press any arrow key to start the game.
    </p>
    <div
      id="complete"
      class="text-center mt-10 pt-6 border-t border-indigo-200"
      [class.hidden]="!finished()"
    >
      <p class="font-sans text-xl text-neutral-300">Game over! You caught {{ score() }} bugs.</p>
      <section class="flex flex-col items-center">
        <button
          (click)="restart()"
          class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
        >
          Restart
        </button>
        <a
          class="heading px-4 py-2 mt-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 cursor-pointer"
        >
          Back to game list
        </a>
      </section>
    </div>
  </section>
</div>
